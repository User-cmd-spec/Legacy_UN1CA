name: Build LegacyUi but with UN1CA features

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a70q]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        env:
          NODE_OPTIONS: "--openssl-legacy-provider"
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SOURCE="$SRC_DIR/out/work_dir/system"

          mkdir -p "$GITHUB_WORKSPACE/debug-artifacts"

          ./scripts/make_rom.sh -f

      - name: Downgrade PCRE2 Runtime
        run: |
          sudo apt-get update
          sudo apt-get install --allow-downgrades -y libpcre2-8-0=10.40*

      - name: Upload debug configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-configs-before-erofs
          path: debug-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: "Upload flasheable zip to Github Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegacyUI-Artifacts-${{ matrix.target }}
          path: out/LegacyUI_*_${{ matrix.target }}-sign.zip
          if-no-files-found: warn
