name: Build LegacyUi but with UN1CA features 

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a70q]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        env:
          NODE_OPTIONS: "--openssl-legacy-provider"
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh
          
      - name: Debug Patch Failure
        run: |
          PATCH_FILE="$SRC_DIR/legacyui/mods/hma/smali/system/framework/services.jar/0001-Introduce-HideAppListUtils.patch"

          # 1. Check if the patch file exists
          if [ ! -f "$PATCH_FILE" ]; then
            echo "ERROR: Patch file does not exist at: $PATCH_FILE"
            echo "Current working directory: $(pwd)"
            echo "Checking contents of SRC_DIR:"
            ls -la "$SRC_DIR" 2>/dev/null || echo "SRC_DIR variable is empty or invalid!"
            exit 1
          fi

          # 2. Run patch with quoted file path
          patch -p1 < "$PATCH_FILE" || {
            echo "=== Patch failed! Rejection log (.rej files): ==="
            find . -name "*.rej" -exec cat {} +
            exit 1
          }
          
      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SOURCE="$SRC_DIR/out/work_dir/system"
          ./scripts/make_rom.sh -f


      - name: "Upload flasheable zip to Github Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: LegacyUI-Artifacts-${{ matrix.target }}
          path: out/LegacyUI_*_${{ matrix.target }}-sign.zip
          continue-on-error: true
